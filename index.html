<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>window.KBO_BASIC_ONLY=true</script><title>단장의 시즌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰은 상단 헤더 + 하단 탭바, 넓은 화면은 왼쪽 레일 + 2열 카드 그리드 */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#eff1eb; --line:#e2e6df; --ink:#16201a; --muted:#5f6b63;
  --accent:#17603d; --accent-ink:#ffffff; --accent-soft:#dcefe3; --seam:#c23b2e;
  --star:#8a6400; --star-bg:#fbefcf; --star-bd:#e0ae2e; --main:#17603d; --main-bg:#dcefe3; --main-bd:#2e8b57;
  --prac:#355a86; --prac-bg:#e2eaf5; --prac-bd:#4f78ae; --gem:#0b6b69; --gem-bg:#d5efed; --gem-bd:#2ba39c;
  --good:#1d7a45; --bad:#b4372b; --mid:#b07a10; --win:#2e8b57; --loss:#c23b2e; --none:#d9ddd5;
  --gS:#a3245a; --gA:#c2490f; --gB:#9a7400; --gC:#2f7d3e; --gD:#3d62b3; --gF:#6b7380;
  --shadow:0 1px 2px rgba(20,40,28,.05); --hatch:rgba(194,59,46,.28);
  --f-disp:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --cond-ink:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a22; --surface:#1f2a37; --surface-2:#243040; --line:#2f3c4d; --ink:#e8edf2; --muted:#8a97a6;
  --accent:#3dd68c; --accent-ink:#06130c; --accent-soft:#173826; --seam:#ff6b5e;
  --star:#f2b544; --star-bg:#3a2e12; --star-bd:#f2b544; --main:#3dd68c; --main-bg:#173826; --main-bd:#3dd68c;
  --prac:#8fb2df; --prac-bg:#1e2b3d; --prac-bd:#6f93c4; --gem:#5fd0c9; --gem-bg:#123432; --gem-bd:#3fb9b1;
  --good:#3dd68c; --bad:#ff6b5e; --mid:#f2b544; --win:#3dd68c; --loss:#ff6b5e; --none:#2f3c4d;
  --gS:#f07aa8; --gA:#f59a62; --gB:#e3c45a; --gC:#6fcf86; --gD:#86a8f0; --gF:#9aa3ad;
  --shadow:none; --cond-ink:#06130c; --hatch:rgba(255,107,94,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a22; --surface:#1f2a37; --surface-2:#243040; --line:#2f3c4d; --ink:#e8edf2; --muted:#8a97a6;
  --accent:#3dd68c; --accent-ink:#06130c; --accent-soft:#173826; --seam:#ff6b5e;
  --star:#f2b544; --star-bg:#3a2e12; --star-bd:#f2b544; --main:#3dd68c; --main-bg:#173826; --main-bd:#3dd68c;
  --prac:#8fb2df; --prac-bg:#1e2b3d; --prac-bd:#6f93c4; --gem:#5fd0c9; --gem-bg:#123432; --gem-bd:#3fb9b1;
  --good:#3dd68c; --bad:#ff6b5e; --mid:#f2b544; --win:#3dd68c; --loss:#ff6b5e; --none:#2f3c4d;
  --gS:#f07aa8; --gA:#f59a62; --gB:#e3c45a; --gC:#6fcf86; --gD:#86a8f0; --gF:#9aa3ad;
  --shadow:none; --cond-ink:#06130c; --hatch:rgba(255,107,94,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)} .good{color:var(--good)} .bad{color:var(--bad)}
.sm{font-size:13px} .xs{font-size:11px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.display{font-family:var(--f-disp);font-weight:400}
.h2{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:22px 0 10px}

/* shell */
.shell{min-height:100%;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:repeating-linear-gradient(90deg,var(--seam) 0 6px,transparent 6px 14px);opacity:.55}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.ttl h1{font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.1}
.ttl p{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.teammark{display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 6px;border-radius:12px;background:var(--tc);color:#fff;font-family:var(--f-disp);font-size:16px;letter-spacing:.02em}
.teammark.lg{min-width:58px;height:58px;font-size:20px;border-radius:16px}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.primary{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;border-radius:12px;font-size:15px}
.primary .ic{width:16px;height:16px;fill:currentColor;stroke:none}
.primary.big{padding:14px 22px;font-size:17px}
.ghost{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;font-weight:500}
.ghost.small,.small{padding:7px 12px;font-size:13px}
.danger{background:var(--bad);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600}
.iconb{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.iconb.sm{width:34px;height:34px;font-size:20px}
.link{color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.savedot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.savedot.ok{background:var(--good)} .savedot.no{background:var(--mid)}
.content{flex:1;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.navb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted)}
.navb.on{color:var(--accent);font-weight:600}
.navb .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--seam);color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
@media (min-width:900px){
  .rail{display:flex;flex-direction:column;gap:4px;width:92px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:16px 8px}
  .rail .navb{padding:10px 0;font-size:12px;border-radius:12px}
  .rail .navb.on{background:var(--accent-soft)}
  .brand{font-family:var(--f-disp);font-size:18px;line-height:1.1;text-align:center;margin-bottom:12px;color:var(--accent)}
  .tabbar{display:none}
  .shell{background:linear-gradient(90deg,var(--surface) 92px,var(--line) 92px,var(--line) 93px,transparent 93px)}
  .content{padding-bottom:40px}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:16px;font-weight:700}
.card h3 small{font-weight:400;font-size:13px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.row-sb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row-sb.wrap{flex-wrap:wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.help{font-size:12.5px;color:var(--muted);line-height:1.55}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:3px;vertical-align:1px}
.tag-v{border-style:dashed}
.tchip{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--tc);color:#fff;letter-spacing:.02em}
.cls{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;margin-left:4px;vertical-align:1px}
.cls-star{background:var(--star-bg);color:var(--star)}
.cls-prac{background:var(--prac-bg);color:var(--prac)}
.cls-gem{background:var(--gem-bg);color:var(--gem)}
.g{font-style:normal;font-size:10.5px;font-weight:700;margin-left:2px}
.g-S{color:var(--gS)}.g-A{color:var(--gA)}.g-B{color:var(--gB)}.g-C{color:var(--gC)}.g-D{color:var(--gD)}.g-F{color:var(--gF)}
.sp{font-family:var(--f-num);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sp i{font-family:var(--f-body);font-style:normal;color:var(--muted);margin-right:3px}
.sp sup{font-family:var(--f-body);font-size:9px;color:var(--muted);margin-left:1px}
.hot{color:var(--bad);font-size:11px;margin-left:3px}.cold{color:var(--gD);font-size:11px;margin-left:3px}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;white-space:nowrap;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.segopt{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.segopt button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);white-space:nowrap}
.segopt button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow);position:relative}
.segopt button.on::after{content:"";position:absolute;top:6px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.segopt.mini button{padding:6px 10px;font-size:13px}
.segopt.mini button.on::after{display:none}

/* home */
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,var(--surface)) 0%,var(--surface) 70%)}
.rec{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.rec .big{font-family:var(--f-disp);font-size:34px;line-height:1}
.rec small{font-family:var(--f-body);font-size:14px;color:var(--muted);margin:0 4px 0 1px}
.rank{font-family:var(--f-disp);font-size:44px;line-height:1;color:var(--tc)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.gauge b{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--good));border-radius:6px}
.gauge i{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.gauge.thin{height:8px}
.gauge.over b{background:var(--bad)}
.mval{font-family:var(--f-disp);font-size:26px}
.mval small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.buff b{font-family:var(--f-disp);font-size:20px;color:var(--star)}
.ng-teams{display:flex;align-items:center;justify-content:center;gap:18px}
.ng-teams>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.vs{font-family:var(--f-disp);font-size:20px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.kv.two{grid-template-columns:auto 1fr}
.games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gline{display:grid;grid-template-columns:34px 1fr 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.games li:last-child .gline{border-bottom:0}
.gline b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wl{display:inline-grid;place-items:center;width:28px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.wl-W{background:var(--accent-soft);color:var(--good)} .wl-L{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)} .wl-D{background:var(--surface-2);color:var(--muted)}
.goalt{font-family:var(--f-disp);font-size:22px}
.bracket{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.br{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.br.live{border-color:var(--accent)}
.br b{font-family:var(--f-num)}
.champ{font-family:var(--f-disp);color:var(--star);font-size:18px}
.plink{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-family:var(--f-num)}
.tbl th:first-child,.tbl td:first-child,.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td:first-child,.tbl td:nth-child(2){font-family:var(--f-body)}
.tbl tr.me td{background:var(--accent-soft)}
.tbl tr.cut td{border-bottom:2px solid var(--seam)}
.tbl.line td,.tbl.line th{text-align:center;padding:6px 4px}
.tbl.line th:first-child,.tbl.line td:first-child{text-align:left}
.tbl.line .r{font-weight:700}
.tbl.box td:first-child{white-space:normal;min-width:120px}
.tbl.stand td:nth-child(2){text-align:left}
.dec{font-style:normal;font-size:11px;font-weight:700;padding:0 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.ord{font-family:var(--f-num);color:var(--muted);font-size:12px}

/* meeting */
.rep .big2,.big2{font-family:var(--f-disp);font-size:24px}
.big2 small{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.swap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.swap{grid-template-columns:1fr}}
.minip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;width:100%;margin-top:6px}
.res{color:var(--accent);font-weight:600}

/* tactics */
.tachead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.preset b{font-size:15px}
.preset span{font-size:12.5px;color:var(--muted);line-height:1.45}
.preset.on{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}
.opt{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.opt h4{font-size:15px}
h4.sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.field{position:relative;width:100%;max-width:520px;aspect-ratio:1.15;margin:4px auto 8px}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.field .grass{fill:color-mix(in srgb,var(--good) 18%,var(--surface))}
.field .dirt{fill:color-mix(in srgb,#c8874a 35%,var(--surface))}
.fpos{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 8px;box-shadow:var(--shadow);min-width:76px;max-width:40%}
.fpos b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fpos small{font-size:10.5px;color:var(--muted)}
.fpos.sel,.prow.sel .pmain{outline:2px solid var(--accent);outline-offset:-1px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:6px;align-items:stretch}
.pmain{flex:1;min-width:0;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.pmain .ord{min-width:12px;text-align:center}
.pos{font-size:12px;color:var(--muted);background:var(--surface-2);padding:3px 6px;border-radius:7px;white-space:nowrap}
.possel{font-size:12px;padding:3px 2px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2)}
.pn{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
.pn b{font-size:15px}
.pn small{font-size:12px}
.ks{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.cond{position:relative;display:inline-block;width:64px;height:22px;border-radius:7px;background:var(--surface-2);overflow:hidden;font-family:var(--f-num);font-size:12px;font-weight:700}
.cond b{position:absolute;inset:0 auto 0 0;border-radius:7px}
.cond span{position:relative;display:grid;place-items:center;height:100%;color:var(--cond-ink)}
.cond.ok b{background:var(--good)} .cond.mid b{background:var(--mid)} .cond.low b{background:var(--bad)}

.cond.inj{width:auto;padding:0 8px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad);font-family:var(--f-body)}
.infob{display:grid;place-items:center;width:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted)}
.mv{padding:0 12px;border:1px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;color:var(--accent);background:var(--surface);white-space:nowrap}
.mv.ghost{color:var(--muted)}
.prow .btns{flex-wrap:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:6px 0}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
select.wide,select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.tchip{padding:2px 6px;border-radius:6px}
.teammark{border-radius:10px}
:root[data-theme="dark"] .teammark,:root[data-theme="dark"] .tchip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .teammark,:root:not([data-theme="light"]) .tchip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}}
:root{--m-worst:#8e1b1b;--m-worst-bg:#f6dada;--m-low:#d33a2c;--m-low-bg:#fce3e0;--m-mid:#c99a00;--m-mid-bg:#fff4c7;--m-good:#2e8b57;--m-good-bg:#dcefe3;--m-top:#2f6fed;--m-top-bg:#e0eafd}
:root[data-theme="dark"]{--m-worst:#e06060;--m-worst-bg:#3a1515;--m-low:#ff6b5e;--m-low-bg:#3a1c1a;--m-mid:#f2c94c;--m-mid-bg:#3a3012;--m-good:#3dd68c;--m-good-bg:#173826;--m-top:#6f9bff;--m-top-bg:#1a2a4a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-worst:#e06060;--m-worst-bg:#3a1515;--m-low:#ff6b5e;--m-low-bg:#3a1c1a;--m-mid:#f2c94c;--m-mid-bg:#3a3012;--m-good:#3dd68c;--m-good-bg:#173826;--m-top:#6f9bff;--m-top-bg:#1a2a4a}}
.m-worst{--mc:var(--m-worst);--mb:var(--m-worst-bg)} .m-low{--mc:var(--m-low);--mb:var(--m-low-bg)} .m-mid{--mc:var(--m-mid);--mb:var(--m-mid-bg)} .m-good{--mc:var(--m-good);--mb:var(--m-good-bg)} .m-top{--mc:var(--m-top);--mb:var(--m-top-bg)}
.morale .mpill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--mb);color:var(--mc)}
.morale .mval{font-family:var(--f-disp);font-size:40px;line-height:1;color:var(--mc)}
.morale .mval small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.gauge.mg b{background:var(--mc)}
.mini3 .mtxt{color:var(--mc)}
.sbar{grid-template-columns:44px 1fr 34px 30px}
.sbar .st{height:10px;border-radius:5px}
.sbar .st b{border-radius:5px}
.sbar.s-top .st b{background:var(--m-good)} .sbar.s-mid .st b{background:var(--prac-bd)} .sbar.s-low .st b{background:var(--bad)}
.sbar .sv{font-family:var(--f-num);font-weight:600;text-align:center;border-radius:6px;font-size:12.5px;padding:1px 0}
.sbar.s-top .sv{background:var(--m-good-bg);color:var(--m-good)} .sbar.s-mid .sv{background:var(--prac-bg);color:var(--prac)} .sbar.s-low .sv{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.sbar .sr{font-size:11.5px;color:var(--muted)}
.ms{grid-template-columns:20px auto 1fr auto 34px}
.ms .nm{text-align:left;font-family:var(--f-body)}
.rankchart .ps-zone{fill:color-mix(in srgb,var(--m-good) 13%,var(--surface));opacity:1}
.rankchart .cut{stroke:color-mix(in srgb,var(--m-good) 55%,var(--surface));stroke-width:1;stroke-dasharray:4 4}
.rankchart .mline{stroke:var(--line);stroke-dasharray:2 3}
.rankchart .rl{stroke:var(--m-top);stroke-width:2.2}
.rankchart .rfill{fill:var(--m-top);opacity:.09}
.rankchart .rdot{fill:var(--m-top)}
.rankchart .rlab{font-size:12.5px;font-weight:700;fill:var(--m-top);font-family:var(--f-body)}
.rankchart .ax{font-size:10.5px}
.mplan2{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.mplan2 b{font-size:22px;font-family:var(--f-num)}
.mplan2 span:first-child b{font-size:26px}
.opps{display:flex;flex-direction:column;gap:6px}
.opp{display:grid;grid-template-columns:auto 1fr 44px 48px;gap:10px;align-items:center;font-size:14px}
.opp span:nth-child(3),.opp span:nth-child(4){text-align:right;font-size:13px}
.opp .b{font-weight:700}
.dItem{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.dItem.warn{border-color:var(--star-bd);background:var(--star-bg)}
.dItem.warn small{color:var(--star)}
.dIc{display:grid;place-items:center;color:var(--muted)} .dIc .ic{width:18px;height:18px}
.dTx{display:flex;flex-direction:column} .dTx b{font-size:14px} .dTx small{font-size:12px;color:var(--muted)}
.dGo{color:var(--muted);font-size:18px}
.big2b{justify-content:center;height:42px;font-size:15px;border-radius:12px}
.top .primary{padding:8px 13px;font-size:13.5px;border-radius:10px}
.top .ghost.small{padding:6px 10px;font-size:12.5px}
.home .card h3{font-size:15px}
/* 가을야구 */
.posthead{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.posthead h2{font-size:32px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.big{font-size:13px;padding:4px 12px}
.bracket2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brx{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.brx.on{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.bt{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap;min-width:0}
.bt .n{font-family:var(--f-num);color:var(--muted);width:12px}
.bt .nk{overflow:hidden;text-overflow:ellipsis}
.bt .sc{margin-left:auto;font-family:var(--f-num)}
.bt.me{border:1.5px solid var(--accent);font-weight:700}
.bt.out{opacity:.5}
.bt.tbd{border-style:dashed;color:var(--muted);background:transparent}
.vsbig{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px}
.vsbig > div{display:flex;flex-direction:column;align-items:center;gap:8px}
.vsmid .vs{font-size:28px}
.sscore{font-family:var(--f-num);font-weight:700;font-size:16px}
.teammark.xl{min-width:64px;height:64px;font-size:22px;border-radius:16px}
.info4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info4 div{display:flex;flex-direction:column;padding:11px 12px;border-radius:12px;background:var(--surface-2);gap:2px}
.info4 small{font-size:12px;color:var(--muted)} .info4 b{font-size:14.5px}
.lbl{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card4{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:28px 1fr;column-gap:8px;row-gap:5px;align-items:center;align-content:start;background:var(--surface);min-height:96px;text-align:left}
.card4.on{border-color:var(--accent);background:var(--accent-soft)}
.card4 .i{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:14px}
.card4 b{font-size:15px} .card4 small{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.45}
.selrow select{margin-top:4px;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface);font-size:13px}
.selrow{grid-template-columns:24px 1fr}
.ghost.big2b{justify-content:center;width:100%}
/* 아이콘 크기 통일 */
.tchip{display:inline-grid;place-items:center;width:34px;height:20px;padding:0;font-size:11px;letter-spacing:.06em;vertical-align:middle}
.teammark{display:inline-grid;place-items:center;width:38px;min-width:38px;height:38px;padding:0;font-size:14px}
.teammark.lg{width:48px;min-width:48px;height:48px;font-size:17px}
.teammark.xl{width:64px;min-width:64px;height:64px;font-size:22px}
/* 헤더 */
.hmini{display:flex;gap:6px;margin-top:4px}
.iconb.mini{width:28px;height:28px;border-radius:8px}
.iconb.mini .ic{width:15px;height:15px}
.setrow{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin-top:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:600}
.setrow small{font-weight:400}
/* 기록실 표 */
.ltab{display:flex;flex-direction:column}
.lrow2{display:grid;grid-template-columns:22px minmax(0,1fr) repeat(5,44px);gap:4px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-size:13px;width:100%}
.lrow2.head{font-family:var(--f-body);font-size:11.5px;color:var(--muted);padding:4px 2px}
.lrow2 > span:nth-child(1),.lrow2 > span:nth-child(2){text-align:left}
.lrow2 .ln{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--f-body)}
.lrow2 .ln b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow2 .lr{color:var(--muted)}
.lrow2 .on{font-weight:700;color:var(--accent)}
.lrow2.head .on{color:var(--accent)}
.lrow2.me{background:var(--accent-soft)}
@media (min-width:600px){.lrow2{grid-template-columns:26px minmax(0,1fr) repeat(5,64px)}}
/* 타순 목록 */
.lrow .pmain{grid-template-columns:18px 40px minmax(0,1fr) auto auto;gap:8px}
.lrow .pn{flex-wrap:nowrap;flex-direction:column;align-items:flex-start;gap:0}
.lrow .pn small{font-size:11.5px}
.lrow .ks{flex-basis:auto;margin:0;display:flex;flex-direction:column;align-items:flex-end;gap:0}
.lrow .ks .sp{font-size:11.5px}
.lrow .pos{text-align:center}
@media (max-width:420px){.lrow .cond{width:44px}}
.helpl{margin:0;display:flex;flex-direction:column;gap:2px}
.helpl dt{font-weight:700;margin-top:10px}
.helpl dd{margin:0;font-size:14px;color:var(--muted);line-height:1.55}
.llist{gap:4px}
.lrow .pmain,.lhead{display:grid;grid-template-columns:16px 34px minmax(0,1fr) 38px 38px 24px 46px;gap:6px;align-items:center;padding:7px 8px}
.lhead{list-style:none;font-size:11px;color:var(--muted);padding:0 8px}
.lhead span:nth-child(n+4){text-align:right} .lhead span:last-of-type{text-align:center}
.llist:has(.infob) .lhead{padding-right:58px}
.lrow .pn{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.lrow .pn b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lrow .pn small{font-size:11px;color:var(--muted);white-space:nowrap}
.lrow .c{font-family:var(--f-num);font-size:12px;text-align:right}
.lrow .pos{font-size:11px;padding:2px 0;text-align:center}
.lrow .cond{width:46px;height:20px;font-size:11px}
.lrow .infob{width:40px}
.cdot2{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.cdot2.d-star{background:var(--star-bd)} .cdot2.d-main{background:var(--main-bd)} .cdot2.d-prac{background:var(--prac-bd)} .cdot2.d-gem{background:var(--gem-bd)}
.lrow .pmain,.lhead{grid-template-columns:14px 30px minmax(0,1fr) 34px 36px 18px 40px;gap:4px;padding:7px 6px}
.lrow .cond{width:40px}
.lrow .infob{width:34px;border-radius:10px}
.llist:has(.infob) .lhead{padding-right:46px}
.lrow2{grid-template-columns:18px minmax(0,1fr) 32px 38px 28px 30px 40px;gap:3px;font-size:12.5px}
@media (min-width:600px){.lrow2{grid-template-columns:26px minmax(0,1fr) repeat(5,64px);gap:6px;font-size:13.5px}}
.lrow2.head span{white-space:nowrap;font-size:10.5px;letter-spacing:-.03em}
.setbar{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.setbar .setrow{margin-top:0;flex:1;min-width:0}
.setbar .setrow small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconb.big{width:52px;height:auto;border-radius:var(--r);background:var(--surface)}
.wl.gno{width:auto;padding:0 8px;background:var(--surface-2);color:var(--muted)}
.wl.gno.wl-W{background:var(--accent-soft);color:var(--good)} .wl.gno.wl-L{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.gsc .hi{color:var(--good)}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:52px 34px 64px 34px 1fr;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:0}
.sno{font-weight:700;color:var(--ink)} .sno.win{color:var(--good)}
.ssc{display:flex;justify-content:center;gap:6px;font-family:var(--f-num);font-size:15px}
.ssc i{font-style:normal;color:var(--muted)} .ssc .hi{color:var(--good)}
.srow small{text-align:right;font-size:12px}
/* 시즌 결산 타이틀 · 골든글러브 */
.pill.gold{background:var(--star-bg);color:var(--star)}
.tcard{gap:2px}
.tsec{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 0}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow.t2{grid-template-columns:56px minmax(0,1fr) 54px 56px}
.trow .lab{font-size:12px;color:var(--muted);font-weight:600}
.trow .p{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0;white-space:nowrap}
.trow .n{font-family:var(--f-num);font-weight:600;font-size:15px;text-align:right}
.trow .rk{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.trow .rk.rtop{color:var(--star);font-weight:700}
.trow.mine{background:var(--star-bg);border-radius:10px;border-bottom-color:transparent}
.fieldg{position:relative;width:100%;max-width:520px;aspect-ratio:1/1.08;margin:4px auto}
.fieldg svg{position:absolute;inset:0;width:100%;height:100%}
.fieldg .grass{fill:color-mix(in srgb,var(--good) 18%,var(--surface))}
.fieldg .dirt{fill:color-mix(in srgb,#c8874a 35%,var(--surface))}
.gg{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 7px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.1);min-width:78px}
.gg small{font-size:10px;color:var(--muted);font-weight:700}
.gg b{display:flex;align-items:center;gap:4px;font-size:12.5px;white-space:nowrap}
.gg b .tchip{width:26px;height:17px;font-size:9.5px}
.gg i{font-style:normal;font-size:9.5px;color:var(--muted);white-space:nowrap}
.gg.mine{border:2px solid var(--star-bd);background:var(--star-bg)}
.gg.mine small{color:var(--star)}
/* 구단 색 헤더 띠 */
.top{border-bottom:3px solid var(--team,var(--line))}
.drhead{border-bottom:3px solid var(--team,var(--line))}
.live-top{border-bottom:3px solid var(--team,var(--line))}
.navb.on{color:var(--accent)}
:root{--m-mid:#8f6d00;--m-mid-bar:#e6b800}
:root[data-theme="dark"]{--m-mid-bar:#f2c94c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-mid-bar:#f2c94c}}
:root:not([data-theme="dark"]) .m-mid{--mbar:var(--m-mid-bar)}
:root[data-theme="dark"] .m-mid{--mbar:var(--m-mid-bar)}
.gauge.mg b{background:var(--mbar,var(--mc))}
:root[data-theme="dark"] .navb .dot{background:#c0392b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .navb .dot{background:#c0392b}}
:root{--m-mid:#7a5d00}
.wl-W{background:var(--m-good-bg)!important;color:var(--good)}
:root:not([data-theme="dark"]) .wl-L{color:#a12f25}
:root:not([data-theme="dark"]) .sbar.s-top .sv{color:#17603d} :root:not([data-theme="dark"]) .sbar.s-mid .sv{color:#2f5687} :root:not([data-theme="dark"]) .sbar.s-low .sv{color:#a12f25}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wl-L{color:var(--bad)} :root:not([data-theme="light"]) .sbar .sv{filter:none}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sbar.s-top .sv{color:var(--m-good)} :root:not([data-theme="light"]) .sbar.s-mid .sv{color:var(--prac)} :root:not([data-theme="light"]) .sbar.s-low .sv{color:var(--bad)}}
/* 결과 공유 카드 */
.sharecard{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:8px solid var(--tc)}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-top h2{font-family:var(--f-disp);font-size:24px;font-weight:400;padding:0}
.sc-eb{font-size:12px;color:var(--muted)}
.sc-rec{display:flex;justify-content:space-between;align-items:flex-end}
.sc-big{font-family:var(--f-disp);font-size:44px;line-height:1}
.sc-big small,.sc-rk small{font-family:var(--f-body);font-size:15px;color:var(--muted);margin:0 3px}
.sc-rk{font-family:var(--f-disp);font-size:48px;line-height:1;color:var(--tc)}
:root[data-theme="dark"] .sc-rk{color:var(--ink)}
.sc-post{font-family:var(--f-disp);font-size:22px}
.sc-gm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2)}
.sc-gm div{display:flex;flex-direction:column} .sc-gm div:last-child{text-align:right}
.sc-gm small{font-size:11.5px;color:var(--muted)} .sc-gm b{font-size:20px} .sc-gm b small{font-size:13px}
.sc-grade{font-family:var(--f-disp);font-size:38px;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--surface)}
.sc-grade.g-S{color:var(--gS)} .sc-grade.g-A{color:var(--gA)} .sc-grade.g-B{color:var(--gB)} .sc-grade.g-C{color:var(--gC)} .sc-grade.g-D{color:var(--gD)}
.sc-sec{display:flex;flex-direction:column;gap:2px}
.sc-sec > p{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.sc-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.sc-row span{color:var(--muted)} .sc-row small{font-weight:400;color:var(--muted);font-size:12px}
.sc-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc-chips span{padding:4px 10px;border-radius:999px;background:var(--star-bg);color:var(--star);font-weight:700;font-size:13px}
.sc-chips small{font-weight:400}
.sc-team{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center}
.sc-team b{display:block;font-family:var(--f-num);font-size:15px;color:var(--ink)}
.sc-foot{font-size:11px;color:var(--muted);text-align:center}
.sharebtns{margin-top:12px}
.landing{max-width:460px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:14px}
.land-btns .primary{width:100%}

/* ---------- 넓은 화면(PC 크롬): 앱 한 줄 기둥으로 가운데 정렬 ---------- */
@media (min-width:681px){
  html{background:color-mix(in srgb,var(--bg) 86%,var(--ink))}
  body{background:transparent}
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(0,0,0,.10)}
  .tabbar,.drbar{left:calc(50% - 320px);right:calc(50% - 320px)}
  .rail{display:none} .tabbar{display:grid} .shell{background:none} .content{padding-bottom:110px}

function goalProgress() {

function leadTable(L, key, isP) {
  const C = { PA: ["타석", st => st.PA], AVG: ["타율", st => avg3(st.AB ? st.H / st.AB : 0)], HR: ["홈런", st => st.HR], RBI: ["타점", st => st.RBI], OPS: ["OPS", st => avg3(opsOf(st))], H: ["안타", st => st.H], SB: ["도루", st => st.SB],
    IP: ["이닝", st => E.outsToIP(st.outs)], ERA: ["ERA", st => era(st)], W: ["승", st => st.W], SO: ["삼진", st => st.SO], WHIP: ["WHIP", st => st.outs ? ((st.H + st.BB) * 3 / st.outs).toFixed(2) : "-"], SV: ["세이브", st => st.SV], HLD: ["홀드", st => st.HLD] };
  let cols = isP ? ["IP", "ERA", "W", "SO", "WHIP"] : ["PA", "AVG", "HR", "RBI", "OPS"];

}

function coachLines() {
  const lines = []; const mine = E.teamPlayers(S, S.user);
  for (const n of S.news.splice(0)) {
    const p = n.pid ? P(n.pid) : null;
    if (n.k === "inj" && p) lines.push(`🩹 <b>${esc(p.n)}</b> ${esc(n.note)} — ${n.d}일 결장 예상`);
    else if (n.k === "back" && p) lines.push(`✅ <b>${esc(p.n)}</b> 부상에서 돌아왔어요`);
    else if (n.k === "dev") lines.push(`📈 원석 육성: ${n.n}명 주요 능력치 +2 (${(n.n * .5).toFixed(1)}억)`);
    else if (n.k === "rel") lines.push(`${esc(n.n)} 방출`);
  }
  const l1 = mine.filter(p => p.lvl === 1 && p.inj === 0);
  const tired = l1.filter(p => !p.isP && p.cond < 50).sort((a, b) => a.cond - b.cond).slice(0, 3);
  if (tired.length) lines.push(`😮‍💨 체력이 떨어진 타자: ${tired.map(p => `<b>${esc(p.n)}</b>(${Math.round(p.cond)})`).join(", ")} — 휴식을 권해요`);
  const cold = l1.filter(p => p.form <= -3.5).slice(0, 3); if (cold.length) lines.push(`❄️ 슬럼프: ${cold.map(p => `<b>${esc(p.n)}</b>`).join(", ")}`);
  const hot = l1.filter(p => p.form >= 3.5).slice(0, 3); if (hot.length) lines.push(`🔥 감이 좋은 선수: ${hot.map(p => `<b>${esc(p.n)}</b>`).join(", ")}`);
  const injL1 = mine.filter(p => p.lvl === 1 && p.inj > 0); if (injL1.length) lines.push(`1군 엔트리에 부상자 ${injL1.length}명(${injL1.map(p => esc(p.n)).join(", ")}) — 2군으로 내리고 대체 선수를 올리는 게 좋아요`);
  for (const kind of [true, false]) {
    const worst = l1.filter(p => p.isP === kind).sort((a, b) => XW(a) - XW(b))[0];
    const best2 = mine.filter(p => p.lvl === 2 && p.isP === kind && p.inj === 0).sort((a, b) => XW(b) - XW(a))[0];
    if (worst && best2 && XW(best2) >= XW(worst) + 0.6) lines.push(`⬆️ 2군 <b>${esc(best2.n)}</b>(${xshort(best2)})이 1군 <b>${esc(worst.n)}</b>(${xshort(worst)})보다 나아 보여요`);
  }
  return lines;
}

function makeMeeting(nextSeg) {

  const r = Math.random(); const n = r < .35 ? 0 : r < .8 ? 1 : 2;
  const lastK = S.lastIssueK || [], lastP = S.lastIssueP || [];
  let pool = ISSUES.filter(x => !lastK.includes(x.k)).map(x => ({ x, c: x.find(c).filter(p => !p || !lastP.includes(p.id)) })).filter(o => o.c.length);
  const out = [];

    for (const q of pool) { u -= q.x.w; if (u <= 0) { o = q; break; } }
    pool = pool.filter(q => q !== o);

    pool = pool.filter(q => !p || !q.c.every(x => x && x.id === p.id));

let flashT = null;
